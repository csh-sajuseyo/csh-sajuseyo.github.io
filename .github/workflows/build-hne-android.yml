name: 한눈에 학원업무 Android 빌드

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-native/**'
      - '.github/workflows/build-hne-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 소스 내려받기
        uses: actions/checkout@v4

      - name: Java 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 설정
        uses: android-actions/setup-android@v3

      - name: Android 36 SDK 설치
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Gradle 8.13 설정
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: APK와 AAB 빌드
        working-directory: android-native
        run: |
          gradle --no-daemon clean assembleDebug bundleDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/HNE-Academy-Work-R2.15.apk
          cp app/build/outputs/bundle/debug/app-debug.aab dist/HNE-Academy-Work-R2.15-debug.aab
          sha256sum dist/* > dist/SHA256SUMS.txt

      - name: 설치용 APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: HNE-Academy-Work-R2.15-APK
          path: android-native/dist/HNE-Academy-Work-R2.15.apk
          if-no-files-found: error

      - name: 전체 빌드 결과 업로드
        uses: actions/upload-artifact@v4
        with:
          name: HNE-Academy-Work-R2.15-All
          path: android-native/dist/*
          if-no-files-found: error
